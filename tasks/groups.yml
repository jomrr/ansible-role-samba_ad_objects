---
# role: samba_ad_objects
# file: tasks/groups.yml

- name: SAMBA_AD_OBJECTS | Manage domain groups before resolving memberships
  jomrr.samba.samba_group: &__samba_ad_objects_group_options
    name: "{{ __samba_ad_objects_group.name }}"
    path: "{{ __samba_ad_objects_group.path | default(omit) }}"
    scope: "{{ __samba_ad_objects_group.scope | default('global') }}"
    category: "{{ __samba_ad_objects_group.category | default('security') }}"
    description: "{{ __samba_ad_objects_group.description | default(omit) }}"
    gid_number: "{{ __samba_ad_objects_group.gid_number | default(omit) }}"
    state: "{{ __samba_ad_objects_group.state | default('present') }}"
  loop: "{{ samba_ad_objects_groups }}"
  loop_control:
    loop_var: __samba_ad_objects_group
    label: "{{ __samba_ad_objects_group.name }}"

- name: SAMBA_AD_OBJECTS | Manage memberships after all groups exist
  jomrr.samba.samba_group:
    <<: *__samba_ad_objects_group_options
    members: "{{ __samba_ad_objects_group.members }}"
    members_purge: "{{ __samba_ad_objects_group.members_purge | default(samba_ad_objects_group_members_purge) }}"
  loop: "{{ samba_ad_objects_groups }}"
  loop_control:
    loop_var: __samba_ad_objects_group
    label: "{{ __samba_ad_objects_group.name }}"
  when:
    - (__samba_ad_objects_group.state | default('present')) == 'present'
    - __samba_ad_objects_group.members is defined
